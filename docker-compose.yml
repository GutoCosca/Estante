# Ambiente de desenvolvimento do Estante
#   Site:       http://localhost:8083
#   phpMyAdmin: http://localhost:8091
# Subir: docker compose up -d     Parar: docker compose down
services:
  web:
    build: .
    ports:
      - "8083:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      # senhas ficam no arquivo .env (fora do git); veja .env.example
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      TZ: America/Sao_Paulo
    # acesso pela extensão Database Client do VS Code (só nesta máquina)
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # na primeira vez que o banco é criado, roda o script do projeto
      - ./sql/sql_codigo.sql:/docker-entrypoint-initdb.d/01-sql_codigo.sql:ro
      - ./sql/02-usuario_app.sh:/docker-entrypoint-initdb.d/02-usuario_app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8091:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  dbdata:
